<div class="container mt-4">
<div class="row g-3 mb-4">

    <div class="col-md-3">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <h6>Total Skills</h6>

                <h2>{{skills.length}}</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <h6>Advanced</h6>

                <h2>{{advancedCount}}</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <h6>Intermediate</h6>

                <h2>{{intermediateCount}}</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <h6>Beginner</h6>

                <h2>{{beginnerCount}}</h2>

            </div>

        </div>

    </div>

</div>
</div>

<div class="container mt-4">
<div class="card shadow-sm border-0">

    <div class="card-body">

        <h4 class="mb-4">

            <i class="bi bi-code-slash"></i>

            My Skills

        </h4>

        <div class="row">

            <div
                class="col-md-6 mb-4"
                *ngFor="let skill of skills">

                <div class="border rounded-4 p-3 h-100">

                    <div class="d-flex justify-content-between">

                        <strong>

                            {{skill.skillName}}

                        </strong>

                        <span
                            class="badge"

                            [style.backgroundColor]="
                            getSkillColor(skill.skillLevel)">

                            {{skill.skillLevel}}

                        </span>

                    </div>

                    <div class="progress mt-3">

                        <div

                            class="progress-bar"

                            [style.width.%]="
                            getSkillPercentage(skill.skillLevel)"

                            [style.backgroundColor]="
                            getSkillColor(skill.skillLevel)">

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
</div>

<div
  *ngIf="showAddModal"
  class="modal d-block"
  tabindex="-1">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Add Skill
        </h5>

        <button
          class="btn-close"
          (click)="closeAddSkillModal()">
        </button>

      </div>

      <div class="modal-body">

        <form
          [formGroup]="addSkillForm"
          (ngSubmit)="addSkill()">

          <div class="mb-3">

            <label>Skill Name</label>

            <input
              class="form-control"
              formControlName="skillName">

          </div>

          <div class="mb-3">

            <label>Skill Level</label>

            <select
              class="form-select"
              formControlName="skillLevel">

              <option value="Beginner">
                Beginner
              </option>

              <option value="Intermediate">
                Intermediate
              </option>

              <option value="Advanced">
                Advanced
              </option>

            </select>

          </div>

          <button
            class="btn w-100"
            style="background:linear-gradient(90deg,#003366,#7c9ec3);color:white;">
            Add Skill
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
<div
*ngIf="showModifyModal"
class="modal d-block"
tabindex="-1">

<div class="modal-dialog">

  <div class="modal-content">

    <div class="modal-header">

      <h5 class="modal-title">
        Modify Skill
      </h5>

      <button
        class="btn-close"
        (click)="closeModifySkillModal()">
      </button>

    </div>

    <div class="modal-body">

      <form
        [formGroup]="modifySkillForm"
        (ngSubmit)="modifySkill()">

        <div class="mb-3">

          <label>Select Skill</label>

          <select
            class="form-select"
            formControlName="existingSkill">

            <option
              *ngFor="let skill of skills"
              [value]="skill.skillName">

              {{skill.skillName}} -
              {{skill.skillLevel}}

            </option>

          </select>

        </div>

        <div class="mb-3">

          <label>New Skill Level</label>

          <select
            class="form-select"
            formControlName="newSkillLevel">

            <option value="Beginner">
              Beginner
            </option>

            <option value="Intermediate">
              Intermediate
            </option>

            <option value="Advanced">
              Advanced
            </option>

          </select>

        </div>

        <button
          class="btn w-100"
          style="background:linear-gradient(90deg,#003366,#7c9ec3);color:white;">

          Modify Skill

        </button>

      </form>

    </div>

  </div>

</div>

</div>
