      Hi, {{name}}!
    </a>
    <div class="dropdown">
      <button
        class="btn btn-light dropdown-toggle"
        type="button"
        data-bs-toggle="dropdown">

        <i class="bi bi-person"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <a
            class="dropdown-item"
            (click)="openAddSkillModal()">
            Add Skill

        </li>

        <li>
          <a

            (click)="openModifySkillModal()">
            Modify Skill

        <li><hr class="dropdown-divider"></li>

        <li>
          <a
            class="dropdown-item"
            [routerLink]="['/intern-profile', email]">

        <li>
          <a

            routerLink="/profile-settings">
            Settings

<div class="container mt-4">
    <h3>My Skills</h3>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Skill</th>
                <th>Level</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let skill of skills">
                <td>{{skill.skillName}}</td>
                <td>{{skill.skillLevel}}</td>
            </tr>
        </tbody>
    </table>
</div>

<div
  *ngIf="showAddModal"
  class="modal d-block"
  tabindex="-1">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Add Skill
        </h5>

        <button
          class="btn-close"
          (click)="closeAddSkillModal()">
        </button>

      </div>

      <div class="modal-body">

        <form
          [formGroup]="addSkillForm"
          (ngSubmit)="addSkill()">

          <div class="mb-3">

            <label>Skill Name</label>

            <input
              class="form-control"
              formControlName="skillName">

          </div>

          <div class="mb-3">

            <label>Skill Level</label>

            <select
              class="form-select"
              formControlName="skillLevel">

              <option value="Beginner">
                Beginner
              </option>

              <option value="Intermediate">
                Intermediate
              </option>

              <option value="Advanced">
                Advanced
              </option>

            </select>

          </div>

          <button
            class="btn w-100"
            style="background:linear-gradient(90deg,#003366,#7c9ec3);color:white;">
            Add Skill
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
<div
*ngIf="showModifyModal"
class="modal d-block"
tabindex="-1">

<div class="modal-dialog">

  <div class="modal-content">

    <div class="modal-header">

      <h5 class="modal-title">
        Modify Skill
      </h5>

      <button
        class="btn-close"
        (click)="closeModifySkillModal()">
      </button>

    </div>

    <div class="modal-body">

      <form
        [formGroup]="modifySkillForm"
        (ngSubmit)="modifySkill()">

        <div class="mb-3">

          <label>Select Skill</label>

          <select
            class="form-select"
            formControlName="existingSkill">

            <option
              *ngFor="let skill of skills"
              [value]="skill.skillName">

              {{skill.skillName}} -
              {{skill.skillLevel}}

            </option>

          </select>

        </div>

        <div class="mb-3">

          <label>New Skill Level</label>

          <select
            class="form-select"
            formControlName="newSkillLevel">

            <option value="Beginner">
              Beginner
            </option>

            <option value="Intermediate">
              Intermediate
            </option>

            <option value="Advanced">
              Advanced
            </option>

          </select>

        </div>

        <button
          class="btn w-100"
          style="background:linear-gradient(90deg,#003366,#7c9ec3);color:white;">

          Modify Skill

        </button>

      </form>

    </div>

  </div>

</div>

</div>
