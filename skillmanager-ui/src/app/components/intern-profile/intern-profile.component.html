<h4 class="mt-4">Skills</h4>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>Skill</th>
            <th>Level</th>
        </tr>
    </thead>

    <tbody>

        <tr *ngFor="let skill of intern.skills">

            <td>{{skill.skillName}}</td>

            <td>{{skill.skillLevel}}</td>

        </tr>

    </tbody>

</table>
