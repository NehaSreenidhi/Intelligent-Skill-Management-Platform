    <div class="container-fluid">

        <a class="navbar-brand text-white">
            AI Intern Search
        </a>

        <div class="dropdown">

            <button
                class="btn btn-light dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown">

                <i class="bi bi-person"></i>

            </button>

            <ul class="dropdown-menu dropdown-menu-end">

                <li>

                    <a
                        class="dropdown-item"
                        routerLink="/mentor-dashboard">

                    </a>

                </li>

                <li>

                    <hr class="dropdown-divider">

                </li>

                <li>

                    <a
                        class="dropdown-item text-danger"
                        (click)="logout()">

                        Logout

                    </a>

                </li>

<div class="container mt-5">

    <div class="card shadow border-0">

        <div class="card-body p-4">

            <h2 class="text-center">

                🤖 AI Intern Search

            </h2>

            <p class="text-center text-muted">

                Describe the intern you're looking for.

            </p>

            <form (ngSubmit)="searchInterns()">

                <div class="input-group mt-4">

                    <input

                        type="text"

                        class="form-control"

                        placeholder="Example: Python developer with Flask and MongoDB experience"

                        [(ngModel)]="query"

                        name="query"

                        required>

                    <button

                        class="btn search-btn"

                        type="submit"

                        style="background:linear-gradient(90deg,#003366,#7c9ec3);color:white;">

                        <i class="bi bi-search"></i>

                        Search

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<div
    class="container mt-5"
    *ngIf="searched">

    <h4 class="mb-4">

        Search Results

        <span class="badge bg-primary">

            {{results.length}}

        </span>

    </h4>

    <div
        class="alert alert-warning"

        *ngIf="results.length==0">

        🤖 No matching interns found.

    </div>

    <div class="row">

        <div

            class="col-lg-4 col-md-6 mb-4"

            *ngFor="let intern of results">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5>

                        {{intern.name}}

                    </h5>

                    <p class="text-muted">

                        <i class="bi bi-envelope-fill me-2"></i>

                        {{intern.email}}

                    </p>

                    <hr>

                    <h6>

                        Matching Skills

                    </h6>

                    <div
                        *ngFor="let skill of intern.skills">

                        <span
                            class="badge bg-success me-2 mb-2">

                            {{skill.skillName}}

                        </span>

                    </div>

                    <button

                        class="btn mt-3 w-100"

                        style="background:linear-gradient(90deg,#003366,#7c9ec3);color:white;"

                        [routerLink]="['/intern-profile',intern.email]">

                        View Profile

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
