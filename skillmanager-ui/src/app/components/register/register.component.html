<div class="container">
  <div class="gradient-border">
    <div class="card shadow rounded p-4 content">

      <form (ngSubmit)="onRegister()">

        <h3 class="text-center mb-4 register-title">
          Register (Only for Interns)
        </h3>

        <div class="mb-3">
          <label class="form-label">Intern Name</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="registerData.name"
            name="name"
            placeholder="Enter your name"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="registerData.email"
            name="email"
            placeholder="Enter your email"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="registerData.password"
            name="password"
            placeholder="Enter your password"
            required>
        </div>

        <button
          type="submit"
          class="btn register-btn w-100">
          Register
        </button>

        <p class="text-center mt-3 text-dark">
          Already have an account?
          <a routerLink="/login">Login</a>
        </p>

      </form>

    </div>
  </div>
</div>
