<nav
  class="navbar navbar-expand-lg"
  style="background: linear-gradient(90deg,#003366,#7c9ec3)">

  <div class="container-fluid">

    <a class="navbar-brand text-white">
      Hi, {{name}}!
    </a>

    <div class="dropdown">

      <button
        class="btn btn-light dropdown-toggle"
        type="button"
        data-bs-toggle="dropdown">

        <i class="bi bi-person"></i>

      </button>

      <ul class="dropdown-menu dropdown-menu-end">

        <li>

          <a
            class="dropdown-item"
            routerLink="/search-interns">

            Search Interns

          </a>

        </li>

        <li>
          <hr class="dropdown-divider">
        </li>

        <li>

          <a
            class="dropdown-item text-danger"
            (click)="logout()">

            Logout

          </a>

        </li>

      </ul>

    </div>

  </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">
        Interns List
    </h2>

    <div class="row">

        <div
            class="col-lg-4 col-md-6 mb-4"
            *ngFor="let intern of interns">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">

                        {{intern.name}}

                    </h5>

                    <p class="text-muted mb-4">

                        <i class="bi bi-envelope-fill me-2"></i>

                        {{intern.email}}

                    </p>

                    <button
                        class="btn w-100"
                        style="background:linear-gradient(90deg,#003366,#7c9ec3);color:white;"
                        [routerLink]="['/intern-profile',intern.email]">

                        View Profile

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
